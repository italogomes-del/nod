appId: app.nod.desktop
productName: nod
copyright: Copyright © 2026 nod
directories:
  output: release
  buildResources: desktop/resources
files:
  - dist/desktop/**
  - package.json
  - '!node_modules/**'
extraMetadata:
  main: dist/desktop/main.mjs
asar: true
asarUnpack:
  - dist/desktop/proxy.mjs
  - dist/desktop/hook-nativas.mjs
npmRebuild: false
artifactName: nod-${version}-${os}-${arch}.${ext}
mac:
  icon: desktop/resources/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  hardenedRuntime: true
  notarize: true
  entitlements: desktop/entitlements.mac.plist
  entitlementsInherit: desktop/entitlements.mac.plist
  minimumSystemVersion: '12.0'
  # Modo ligação (2026-10-04, ADR-071): o texto que o macOS mostra ao pedir o microfone.
  extendInfo:
    NSMicrophoneUsageDescription: O nod usa o microfone só durante as ligações com os seus bots.
dmg:
  sign: true
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish: null
