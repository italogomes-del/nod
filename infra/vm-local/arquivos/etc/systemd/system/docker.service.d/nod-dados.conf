# NOD-93: o dockerd guarda containers e volumes no disco de dados (daemon.json), que o Lima monta durante o boot.
# Sem ele montado, o docker não sobe: escrever no disco base perderia tudo na próxima atualização do app.
[Unit]
After=local-fs.target
[Service]
ExecStartPre=/usr/local/lib/nod/esperar-dados.sh
