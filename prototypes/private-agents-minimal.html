<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Bots - Grokbot Inspired</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#f7f7f8;
      --panel:#ffffff;
      --panel-soft:#f3f4f6;
      --line:#ececf0;
      --line-2:#d7dbe2;
      --ink:#11131a;
      --ink-2:#394150;
      --ink-3:#7b8393;
      --blue:#1f67c6;
      --blue-soft:#e8f1ff;
      --dark:#0f1115;
      --shadow:0 10px 30px rgba(8, 10, 14, 0.08);
      --font:"Inter",system-ui,-apple-system,sans-serif;
      --ctx-private-a:#e7f0ff;
      --ctx-private-b:#f9fbff;
      --ctx-leapy-a:#efe5ff;
      --ctx-leapy-b:#fbf9ff;
      --ctx-gamefik-a:#ffe9d8;
      --ctx-gamefik-b:#fffaf6;
      --list-private-a:rgba(72,121,228,.22);
      --list-private-b:rgba(255,255,255,.74);
      --list-leapy-a:rgba(133,88,216,.22);
      --list-leapy-b:rgba(255,255,255,.74);
      --list-gamefik-a:rgba(241,133,57,.22);
      --list-gamefik-b:rgba(255,255,255,.74);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font:400 14px/1.45 var(--font);
      color:var(--ink);
      background:radial-gradient(1200px 380px at 10% -20%, #f5f7ff 0%, var(--bg) 55%);
      -webkit-font-smoothing:antialiased;
    }
    button,input,textarea{font:inherit;color:inherit}
    button{cursor:pointer;border:0;background:none}
    [hidden]{display:none !important}
    :focus-visible{
      outline:2px solid var(--blue);
      outline-offset:2px;
      border-radius:8px;
    }

    .app{
      height:100dvh;
      display:grid;
      grid-template-columns:64px 336px 1fr;
      min-height:0;
    }

    .rail{
      background:#12141a;
      border-right:1px solid #2a2f39;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:9px;
      padding:10px 0;
      min-height:0;
    }
    .rail .r-btn{
      width:38px;
      height:38px;
      border-radius:12px;
      display:grid;
      place-items:center;
      position:relative;
      color:#e5e8ef;
      border:1px solid transparent;
      transition:background-color .16s ease, transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }
    .rail .r-btn:hover{
      background:#1f232d;
      transform:translateY(-1px);
      border-color:#2f3644;
    }
    .rail .r-btn.active{
      background:#fff;
      color:#11131a;
      box-shadow:0 8px 18px rgba(0,0,0,.22);
    }
    .rail .r-btn.active::before{
      content:"";
      position:absolute;
      left:-11px;
      top:8px;
      width:3px;
      height:22px;
      border-radius:0 2px 2px 0;
      background:#fff;
    }
    .rail .r-sep{
      width:22px;
      height:1px;
      background:#343946;
      margin:3px 0 2px;
    }
    .rail .r-cap{
      font-size:8.5px;
      letter-spacing:.06em;
      text-transform:uppercase;
      color:#7c8393;
      margin-top:-3px;
      margin-bottom:3px;
    }
    .rail .r-badge{
      position:absolute;
      right:-3px;
      top:-3px;
      min-width:16px;
      height:16px;
      padding:0 4px;
      border-radius:999px;
      background:#2563eb;
      color:#fff;
      font-size:10px;
      font-weight:700;
      display:grid;
      place-items:center;
      border:2px solid #12141a;
    }

    .sidebar{
      min-height:0;
      border-right:1px solid var(--line);
      background:linear-gradient(180deg,var(--ctx-grad-a,#f6f8ff),var(--ctx-grad-b,#ffffff));
      display:flex;
      flex-direction:column;
      transition:background .25s ease;
      position:relative;
    }
    .sidebar[data-context="private"]{
      --ctx-grad-a:var(--ctx-private-a);
      --ctx-grad-b:var(--ctx-private-b);
      --list-grad-a:var(--list-private-a);
      --list-grad-b:var(--list-private-b);
    }
    .sidebar[data-context="leapy"]{
      --ctx-grad-a:var(--ctx-leapy-a);
      --ctx-grad-b:var(--ctx-leapy-b);
      --list-grad-a:var(--list-leapy-a);
      --list-grad-b:var(--list-leapy-b);
    }
    .sidebar[data-context="gamefik"]{
      --ctx-grad-a:var(--ctx-gamefik-a);
      --ctx-grad-b:var(--ctx-gamefik-b);
      --list-grad-a:var(--list-gamefik-a);
      --list-grad-b:var(--list-gamefik-b);
    }
    .sidebar[data-context="private"] #privateSidebar,
    .sidebar[data-context="private"] #companySidebar{
      background:linear-gradient(180deg,rgba(91,137,230,.12),rgba(255,255,255,0) 38%);
    }
    .sidebar[data-context="leapy"] #privateSidebar,
    .sidebar[data-context="leapy"] #companySidebar{
      background:linear-gradient(180deg,rgba(141,102,219,.12),rgba(255,255,255,0) 38%);
    }
    .sidebar[data-context="gamefik"] #privateSidebar,
    .sidebar[data-context="gamefik"] #companySidebar{
      background:linear-gradient(180deg,rgba(245,140,63,.14),rgba(255,255,255,0) 38%);
    }

    .search-wrap{
      padding:10px 10px 8px;
      border-bottom:1px solid var(--line);
    }
    .search-row{
      display:grid;
      grid-template-columns:1fr 26px;
      gap:8px;
      align-items:center;
    }
    .search{
      height:30px;
      border:1px solid var(--line);
      border-radius:8px;
      padding:0 10px;
      display:flex;
      align-items:center;
      gap:6px;
      background:var(--panel-soft);
      color:var(--ink-3);
    }
    .search input{
      border:0;
      background:none;
      width:100%;
      outline:none;
      font-size:13px;
    }
    .create-trigger{
      width:26px;
      height:26px;
      border-radius:8px;
      border:1px solid var(--line-2);
      background:linear-gradient(#fff,#f9fafb);
      color:#707789;
      font-size:16px;
      line-height:1;
      display:grid;
      place-items:center;
      transition:border-color .16s ease, color .16s ease, box-shadow .16s ease;
    }
    .create-trigger:hover{
      border-color:#c5cada;
      color:#4d5567;
      box-shadow:0 0 0 3px rgba(31,103,198,.08);
    }

    .favorites{
      margin-top:8px;
      border:1px dashed transparent;
      border-radius:10px;
      padding:6px 4px 4px;
      min-height:72px;
      transition:border-color .14s ease, background .14s ease;
    }
    .favorites-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 4px 5px;
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.05em;
      color:#7b8393;
      font-weight:600;
    }
    .favorites-head b{
      font-size:10.5px;
      color:#505a6d;
      font-weight:700;
      min-width:56px;
      text-align:right;
    }
    .favorites-note{
      padding:5px 5px 2px;
      font-size:10.5px;
      color:#7a8394;
      min-height:18px;
    }
    .favorites.is-drop{
      border-color:var(--blue);
      background:var(--blue-soft);
    }
    .fav-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:6px;
    }
    .fav{
      border-radius:8px;
      padding:4px 3px;
      text-align:center;
      color:var(--ink-2);
      min-height:58px;
      user-select:none;
    }
    .fav:hover{background:var(--panel-soft)}
    .fav .icon{margin:0 auto 3px}
    .fav b{
      display:block;
      font-size:10.5px;
      line-height:1.2;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .fav span{
      font-size:9.5px;
      color:var(--ink-3);
    }

    .list{
      min-height:0;
      overflow:auto;
      padding:8px 6px 12px;
      margin:6px 8px 10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.68);
      background:linear-gradient(180deg,var(--list-grad-a,rgba(255,255,255,.5)),var(--list-grad-b,rgba(255,255,255,.8)));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.45);
    }
    .company-head{
      padding:12px 10px 8px;
      border-bottom:1px solid var(--line);
    }
    .company-head .ttl{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:3px;
      font-size:14px;
      font-weight:700;
      color:#222838;
    }
    .company-head .sub{
      margin:0;
      font-size:11.5px;
      color:#7d8698;
    }
    .ctx-back{
      margin:8px 0 0;
      width:100%;
      border:1px solid var(--line-2);
      border-radius:8px;
      padding:6px 8px;
      text-align:left;
      font-size:12px;
      color:#4e586c;
      background:#fbfcfd;
    }
    .ctx-back:hover{border-color:#c8cfdb;background:#f4f7fc}
    .section{
      margin:6px 0 10px;
      border-radius:10px;
      border:1px solid transparent;
      transition:border-color .14s ease, background .14s ease;
    }
    .section.is-drop{
      border-color:#bfd4fa;
      background:#f7faff;
    }
    .section h3{
      margin:0;
      padding:6px 8px;
      font-size:11px;
      letter-spacing:.04em;
      text-transform:uppercase;
      color:var(--ink-3);
      font-weight:600;
    }
    .row{
      width:100%;
      border-radius:8px;
      padding:7px 8px;
      text-align:left;
      display:grid;
      grid-template-columns:24px 1fr auto;
      align-items:center;
      gap:8px;
      color:var(--ink-2);
      border:1px solid transparent;
    }
    .row:hover{background:var(--panel-soft)}
    .row.active{
      background:#f0f3f8;
      border-color:#e1e6ef;
    }
    .txt{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:1px;
    }
    .txt b{
      font-size:13px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      color:var(--ink);
    }
    .txt span{
      font-size:11.5px;
      color:var(--ink-3);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .meta{
      text-align:right;
      color:var(--ink-3);
      font-size:11px;
      display:flex;
      align-items:center;
      gap:6px;
    }
    .meta .pin{
      font-size:10px;
      color:#667084;
      opacity:.8;
    }
    .meta .dot{
      width:6px;
      height:6px;
      border-radius:50%;
      background:var(--blue);
      display:inline-block;
    }

    .icon{
      width:24px;
      height:24px;
      border-radius:8px;
      display:grid;
      place-items:center;
      font-size:9px;
      font-weight:700;
      color:#fff;
      flex:none;
    }
    .shape-square{border-radius:7px}
    .shape-circle{border-radius:50%}
    .shape-hex{
      clip-path:polygon(25% 7%,75% 7%,100% 50%,75% 93%,25% 93%,0 50%);
      border-radius:0;
    }
    .c-purple{background:#a280f5}
    .c-black{background:#0f1115}
    .c-pink{background:#f45db7}
    .c-teal{background:#38c8bc}
    .c-blue{background:#3b82f6}
    .c-orange{background:#ff8d3a}
    .c-green{background:#1fbf73}
    .c-red{background:#ff5a67}
    .c-lilac{background:#9f78ff}
    .c-brown{background:#ad8b5f}

    .me{
      margin-top:auto;
      border-top:1px solid var(--line);
      padding:8px 10px;
      font-size:12px;
      color:#4d5567;
      display:flex;
      align-items:center;
      gap:7px;
    }
    .me .av{
      width:18px;
      height:18px;
      border-radius:50%;
      background:#d1d5dc;
      display:grid;
      place-items:center;
      font-size:9px;
      color:#5a6272;
      font-weight:700;
    }

    .main{
      min-height:0;
      display:flex;
      flex-direction:column;
      position:relative;
      background:var(--panel);
      margin:6px;
      border:1px solid var(--line);
      border-top-left-radius:18px;
      border-bottom-left-radius:18px;
      border-top-right-radius:10px;
      border-bottom-right-radius:10px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }
    .head{
      min-height:43px;
      border-bottom:1px solid var(--line);
      padding:8px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      flex:none;
    }
    .head .left{
      display:flex;
      align-items:center;
      gap:7px;
      min-width:0;
    }
    .head .name{
      font-size:13.5px;
      font-weight:600;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .head .tag{
      font-size:10px;
      color:var(--ink-3);
      background:var(--panel-soft);
      border:1px solid var(--line);
      padding:2px 6px;
      border-radius:999px;
    }
    .main[data-context="private"] .head .tag{
      border-color:#d6e4ff;
      background:#eef4ff;
      color:#355da6;
    }
    .main[data-context="leapy"] .head .tag{
      border-color:#e1d6ff;
      background:#f4efff;
      color:#5b3da3;
    }
    .main[data-context="gamefik"] .head .tag{
      border-color:#ffd9be;
      background:#fff2e8;
      color:#9d4b11;
    }
    .head .actions{
      display:flex;
      align-items:center;
      gap:5px;
      color:#9097a6;
    }
    .head .actions button{
      width:20px;
      height:20px;
      border-radius:6px;
      display:grid;
      place-items:center;
      font-size:13px;
    }
    .head .actions button:hover{background:var(--panel-soft)}

    .chat{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      width:100%;
      background:#fff;
    }
    .scroll{
      flex:1;
      min-height:0;
      overflow:auto;
      padding:12px 14px 18px;
    }
    .timeline{
      max-width:880px;
      margin:0 auto;
      width:100%;
    }
    .time-sep{
      margin:10px 0 12px;
      text-align:center;
      color:#9aa2b0;
      font-size:11px;
    }
    .message{
      display:flex;
      margin-bottom:8px;
      position:relative;
      width:100%;
    }
    .message.you{justify-content:flex-end}
    .bubble{
      max-width:min(76%, 740px);
      border-radius:15px;
      padding:9px 12px;
      font-size:13.5px;
      line-height:1.5;
      box-shadow:0 1px 0 rgba(0,0,0,.04);
    }
    .message.bot .bubble{
      background:#f0f2f5;
      color:#202530;
      border-top-left-radius:8px;
    }
    .message.you .bubble{
      background:#101216;
      color:#fff;
      border-top-right-radius:8px;
    }
    .bubble-wrap{
      position:relative;
      max-width:min(76%, 740px);
    }
    .message .msg-actions{
      position:absolute;
      right:6px;
      top:-16px;
      display:flex;
      gap:6px;
      opacity:0;
      pointer-events:none;
      transform:translateY(2px);
      transition:opacity .12s ease, transform .12s ease;
    }
    .message:hover .msg-actions{
      opacity:1;
      pointer-events:auto;
      transform:translateY(0);
    }
    .msg-actions button{
      width:32px;
      height:30px;
      border-radius:11px;
      border:1px solid var(--line);
      background:#fff;
      color:#7d8596;
      box-shadow:0 4px 12px rgba(8, 10, 14, 0.07);
      font-size:15px;
      display:grid;
      place-items:center;
    }
    .msg-actions button:hover{
      border-color:#cdd2dc;
      color:#5f6779;
    }

    .starter{
      width:min(560px, 100%);
      background:#f2f3f5;
      border:1px solid #e5e8ee;
      border-radius:14px;
      overflow:hidden;
      margin-bottom:12px;
    }
    .starter .intro{
      padding:10px 12px 8px;
      font-size:14px;
      color:#2f3746;
      line-height:1.42;
    }
    .starter .q{
      border-top:1px solid #e1e5eb;
      background:#fff;
      padding:8px;
    }
    .starter .q h4{
      margin:0 0 2px;
      font-size:13px;
    }
    .starter .q p{
      margin:0 0 7px;
      color:var(--ink-3);
      font-size:12px;
    }
    .choices{
      display:grid;
      gap:2px;
      border:1px solid var(--line);
      border-radius:8px;
      overflow:hidden;
      background:#f9fafb;
    }
    .choice{
      border:0;
      background:#f7f8fa;
      border-bottom:1px solid var(--line);
      text-align:left;
      padding:8px 10px;
      font-size:12.5px;
      line-height:1.35;
      display:flex;
      gap:8px;
      align-items:flex-start;
    }
    .choice:last-child{border-bottom:0}
    .choice:hover{background:#edf1f7}
    .badge{
      width:14px;
      height:14px;
      border-radius:4px;
      background:#dce2ec;
      color:#7d8699;
      font-size:10px;
      display:grid;
      place-items:center;
      flex:none;
      margin-top:1px;
    }
    .choice b{
      display:block;
      font-size:12.5px;
      color:#222838;
    }
    .choice span{
      color:#6e7788;
      font-size:12px;
    }
    .free{
      margin-top:6px;
      border:1px solid var(--line);
      border-radius:8px;
      padding:6px 8px;
      font-size:12.5px;
      color:#7a8292;
      background:#fff;
    }

    .composer{
      border-top:1px solid var(--line);
      padding:8px 10px 10px;
      background:#fff;
      flex:none;
    }
    .composer .box{
      max-width:100%;
      margin:0 auto;
      border:1px solid var(--line-2);
      border-radius:14px;
      min-height:38px;
      padding:6px 8px;
      display:flex;
      align-items:flex-end;
      gap:7px;
      background:#fff;
    }
    .composer textarea{
      flex:1;
      border:0;
      outline:none;
      resize:none;
      background:none;
      min-height:22px;
      max-height:170px;
      line-height:1.44;
      font-size:13.5px;
      padding-top:3px;
    }
    .composer .send{
      width:24px;
      height:24px;
      border-radius:50%;
      background:#111319;
      color:#fff;
      display:grid;
      place-items:center;
      font-size:12px;
      margin-bottom:2px;
    }

    .palette{
      position:absolute;
      top:8px;
      left:12px;
      width:min(640px, calc(100% - 24px));
      background:#fff;
      border:1px solid var(--line);
      border-radius:12px;
      box-shadow:var(--shadow);
      z-index:40;
      padding:8px 8px 6px;
    }
    .palette .ph{
      font-size:13px;
      color:#667082;
      margin:2px 4px 7px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .palette .ph button{
      width:20px;
      height:20px;
      border-radius:6px;
      color:#98a0af;
      display:grid;
      place-items:center;
      font-size:14px;
    }
    .palette .ph button:hover{background:#f3f5f8}
    .palette .opt{
      width:100%;
      border-radius:8px;
      padding:8px;
      display:flex;
      align-items:center;
      gap:8px;
      text-align:left;
      color:#2f3543;
    }
    .palette .opt:hover{background:#f5f7fa}
    .palette .opt.main{
      border:1px solid var(--line);
      margin-bottom:3px;
      background:#fafbfc;
    }
    .palette .opt .mini{
      width:14px;
      height:14px;
      border-radius:50%;
      border:1px solid #c9cfdb;
      color:#7e8797;
      display:grid;
      place-items:center;
      font-size:10px;
      flex:none;
    }
    .palette .list{
      max-height:230px;
      overflow:auto;
      padding:2px 0 0;
      margin:0;
    }

    .toast{
      position:fixed;
      left:50%;
      top:14px;
      transform:translateX(-50%);
      border:1px solid var(--line-2);
      border-radius:999px;
      background:#fff;
      color:#273042;
      box-shadow:var(--shadow);
      padding:7px 12px;
      font-size:12px;
      z-index:90;
    }

    @media (max-width:900px){
      .app{grid-template-columns:1fr}
      .rail,.sidebar{display:none}
      .main{border-left:0}
      .main{
        margin:0;
        border:0;
        border-radius:0;
      }
      .palette{left:8px;top:8px;width:calc(100% - 16px)}
      .timeline{max-width:100%}
      .bubble{max-width:86%}
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail" id="contextRail" aria-label="Contextos"></aside>

    <aside class="sidebar">
      <div id="privateSidebar">
        <div class="search-wrap">
          <div class="search-row">
            <label class="search" aria-label="Buscar">
              <span>⌕</span>
              <input id="searchInput" value="Buscar">
            </label>
            <button class="create-trigger" id="createBtn" aria-label="Criar ou buscar bots">+</button>
          </div>

          <div class="favorites" id="favoritesDrop" aria-label="Favoritos">
            <div class="favorites-head"><span>Favoritos</span><b id="favCount">0 fixados</b></div>
            <div class="fav-grid" id="favoritesGrid"></div>
            <div class="favorites-note" id="favNote">Arraste bots para ca para fixar no topo.</div>
          </div>
        </div>

        <div class="list" id="sectionsMount"></div>

        <div class="me"><span class="av">MW</span> Marlon Wanderlich</div>
      </div>

      <div id="companySidebar" hidden>
        <div class="company-head">
          <div class="ttl">
            <span class="icon c-purple shape-square" id="companyBadge">LE</span>
            <span id="companyTitle">Leapy</span>
          </div>
          <p class="sub">Canais e conversas da empresa</p>
          <button class="ctx-back" id="backToPrivate">← Voltar para Meus agentes</button>
        </div>

        <div class="search-wrap">
          <label class="search" aria-label="Buscar no workspace">
            <span>⌕</span>
            <input id="companySearchInput" value="Buscar na empresa">
          </label>
        </div>

        <div class="list" id="companySectionsMount"></div>

        <div class="me"><span class="av">LE</span> Workspace da empresa</div>
      </div>
    </aside>

    <main class="main">
      <header class="head">
        <div class="left">
          <span class="icon c-pink shape-square" id="headIcon">LG</span>
          <span class="name" id="headName">LGPD</span>
          <span class="tag" id="headTag">privado</span>
        </div>
        <div class="actions">
          <button aria-label="Compartilhar">↗</button>
          <button aria-label="Arquivar">⌂</button>
        </div>
      </header>

      <section class="chat">
        <div class="scroll" id="chatScroll">
          <div class="timeline" id="timeline"></div>
        </div>
        <div class="composer">
          <div class="box">
            <textarea id="composer" rows="1" placeholder="Mensagem para o Bot"></textarea>
            <button class="send" id="sendBtn" aria-label="Enviar">↑</button>
          </div>
        </div>
      </section>

      <div class="palette" id="palette" hidden>
        <div class="ph">
          <span>Para: Buscar ou criar Bots</span>
          <button id="closePalette" aria-label="Fechar">×</button>
        </div>
        <button class="opt main" id="createNewOption"><span class="mini">+</span>Criar novo Bot</button>
        <button class="opt"><span class="mini">↔</span>Criar chat em grupo</button>
        <div class="list" id="paletteBotList"></div>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script>
    (function(){
      var sectionsOrder = ["produto","devpool","organizadores","sem-secao"];
      var sectionTitles = {
        produto: "Produto e Engenharia",
        devpool: "Dev Pool",
        organizadores: "Organizadores",
        "sem-secao": "Sem secao"
      };
      var companyGroupOrder = ["Canais","Turmas","Diretas"];

      var companies = [
        {

              ]
            },
            {
              id: "ch-ana",
              label: "Ana Beatriz",
              type: "dm",
              group: "Diretas",
              preview: "Obrigada, faz sentido",
              time: "18:12",
              unread: false,
              messages: [
                {from:"you", text:"Consegue revisar o texto antes de eu liberar para os gestores?"},
                {from:"bot", text:"Consigo. Entrego uma versao curta e uma versao formal daqui a pouco."}
              ]
            }
          ]
        },
        {
          id: "co-gamefik",
          name: "Gamefik",
          abbr: "GA",
          color: "c-orange",
          channels: [
            {
              id: "ch-roadmap",
              label: "roadmap-q4",
              type: "public",
              group: "Canais",
              preview: "2 epicos sem estimativa",
              time: "Ontem",
              unread: true,
              messages: [
                {from:"bot", text:"Temos dois epicos sem dono no Q4. Posso abrir rascunho de distribuicao com os squads?"},

              ]
            },
            {

              label: "financeiro",
              type: "private",
              group: "Canais",
              preview: "Fechamento pendente",
              time: "Ontem",
              unread: false,
              messages: [
                {from:"bot", text:"Fechamento de agosto pronto para validacao com o time financeiro."}
              ]
            }
          ]
        }
      ];

      var bots = [
        {
          id: "b-rs",
          name: "Ressaca",
          subtitle: "Feature lead",
          preview: "Fechado.",
          time: "Ontem",
          section: "produto",
          favorite: true,
          unread: false,
          shape: "shape-square",
          color: "c-purple",
          messages: [
            {from:"bot", text:"Oi, Marlon. Ja revisei os ultimos cards e deixei os proximos passos prontos para voce."},
            {from:"you", text:"Perfeito. Atualize tambem o plano do sprint com os bloqueios de cada squad."},
            {from:"bot", text:"Feito. Quer que eu tambem monte um resumo de risco para enviar no canal da diretoria?"}
          ]
        },
        {
          id: "b-mr",
          name: "Marola",
          subtitle: "Tech lead",
          preview: "QA localhost fechado.",
          time: "Ontem",
          section: "produto",
          favorite: true,
          unread: true,
          shape: "shape-hex",
          color: "c-black",
          messages: [
            {from:"bot", text:"A build da API passou e deixei os links dos logs separados por servico."},
            {from:"you", text:"Manda os dois erros mais recorrentes de novo para eu repassar com o time."}
          ]
        },
        {
          id: "b-tg",
          name: "Taga",
          subtitle: "Slack",
          preview: "Review em progresso.",
          time: "Ontem",
          section: "produto",
          favorite: true,
          unread: false,
          shape: "shape-square",
          color: "c-pink",
          messages: [
            {from:"bot", text:"Acabei de consolidar os comentarios pendentes no PR #415."},
            {from:"you", text:"Boa. Marca os que impactam release de hoje como prioridade alta."}
          ]
        },
        {
          id: "b-bz",
          name: "BugZero",
          subtitle: "Bug triage",
          preview: "Sem alertas novos.",
          time: "Ontem",
          section: "produto",
          favorite: true,
          unread: false,
          shape: "shape-hex",
          color: "c-teal",
          messages: [
            {from:"bot", text:"Nenhum bug bloqueante novo desde o ultimo checkpoint."}
          ]
        },
        {
          id: "b-d2",
          name: "Dev 2",
          subtitle: "",
          preview: "Assign import cronograma.",
          time: "Ontem",
          section: "devpool",
          favorite: false,
          unread: false,
          shape: "shape-circle",
          color: "c-green",
          messages: [
            {from:"bot", text:"Peguei a tarefa do cronograma e ja deixei um plano de execucao em tres etapas."}
          ]
        },
        {
          id: "b-d3",
          name: "Dev 3",
          subtitle: "",
          preview: "BKO v2 sem cohort id.",
          time: "Ontem",
          section: "devpool",
          favorite: false,
          unread: false,
          shape: "shape-hex",
          color: "c-orange",
          messages: [
            {from:"bot", text:"Ajustei o endpoint e removi a dependencia do cohort id para esse fluxo."}
          ]
        },
        {
          id: "b-angu",
          name: "Angu",
          subtitle: "Gmail",
          preview: "Lucas pingou no Slack.",
          time: "Ontem",
          section: "organizadores",
          favorite: false,
          unread: false,
          shape: "shape-square",
          color: "c-blue",
          messages: [
            {from:"bot", text:"Li o ultimo e-mail do Lucas e montei resposta sugerida para voce aprovar."}
          ]
        },
        {
          id: "b-lgpd",
          name: "LGPD",
          subtitle: "",
          preview: "Panorama de tarefas no ClickUp.",
          time: "sexta-feira",
          section: "sem-secao",
          favorite: false,
          unread: false,
          shape: "shape-square",
          color: "c-pink",
          starter: {
            intro: "Oi, Marlon. Aqui e o New Bot - acabamos de nos conhecer. Pronto pra te ajudar no que for mais util pra voce.",
            title: "Pra que voce quer me usar?",
            subtitle: "Pode escolher ou escrever do seu jeito.",
            options: [
              ["A","Tarefas do dia a dia","Lembretes, organizacao, follow-ups"],
              ["B","Trabalho na Leapy","Produto, ClickUp, Slack, codigo..."],
              ["C","Pesquisa e respostas","Pesquisas, comparacoes e drafts"],
              ["D","Ainda nao sei","Me ajuda a descobrir no caminho"]
            ]
          },
          messages: [
            {from:"you", text:"Ola, voce e meu novo agente. Quero que me ajude a responder formularios da LGPD e organizar tarefas do ClickUp relacionadas a pendencias que a gente tem com empresas."},
            {from:"bot", text:"Perfeito. Vou checar o que ja tenho acesso e mapear as tasks da LGPD pra te dar um panorama em linguagem simples."},
            {from:"bot", text:"Cliquei no ClickUp, encontrei as tarefas abertas e ja posso montar respostas base para os formularios. Quer priorizar tarefas vencidas ou formularios?"}
          ]
        }
      ];

      var state = {
        mode: "private",
        currentCompanyId: "co-leapy",
        currentBotId: "b-lgpd",
        currentChannelByCompany: {
          "co-leapy": "ch-comite",
          "co-gamefik": "ch-roadmap"
        },
        dragBotId: null,
        pointerCandidateId: null,
        pointerStartX: 0,
        pointerStartY: 0,
        newBotCount: 1
      };

      var contextRail = document.getElementById("contextRail");
      var sidebarEl = document.querySelector(".sidebar");
      var mainPanel = document.querySelector(".main");
      var privateSidebar = document.getElementById("privateSidebar");
      var companySidebar = document.getElementById("companySidebar");
      var companyBadge = document.getElementById("companyBadge");
      var companyTitle = document.getElementById("companyTitle");
      var companySectionsMount = document.getElementById("companySectionsMount");
      var sectionsMount = document.getElementById("sectionsMount");
      var favoritesGrid = document.getElementById("favoritesGrid");
      var favoritesDrop = document.getElementById("favoritesDrop");
      var favCount = document.getElementById("favCount");
      var favNote = document.getElementById("favNote");
      var timeline = document.getElementById("timeline");
      var palette = document.getElementById("palette");
      var paletteBotList = document.getElementById("paletteBotList");
      var toast = document.getElementById("toast");
      var headName = document.getElementById("headName");
      var headIcon = document.getElementById("headIcon");
      var headTag = document.getElementById("headTag");
      var chatScroll = document.getElementById("chatScroll");
      var composer = document.getElementById("composer");
      var createBtn = document.getElementById("createBtn");
      var backToPrivate = document.getElementById("backToPrivate");

      function initials(name){
        return name.split(" ").map(function(part){ return part[0]; }).join("").slice(0,2).toUpperCase();
      }
      function formatTime(){
        var d = new Date();
        var h = String(d.getHours()).padStart(2,"0");
        var m = String(d.getMinutes()).padStart(2,"0");
        return h + ":" + m;
      }
      function showToast(text){
        toast.textContent = text;
        toast.hidden = false;
        window.clearTimeout(showToast._timer);
        showToast._timer = window.setTimeout(function(){ toast.hidden = true; }, 2600);
      }
      function getBot(id){
        return bots.find(function(bot){ return bot.id === id; });
      }
      function getCompany(id){
        return companies.find(function(company){ return company.id === id; });
      }
      function getChannel(companyId, channelId){
        var company = getCompany(companyId);
        if(!company){ return null; }
        return company.channels.find(function(channel){ return channel.id === channelId; }) || null;
      }
      function getCurrentChannel(){
        var channelId = state.currentChannelByCompany[state.currentCompanyId];
        return getChannel(state.currentCompanyId, channelId);
      }
      function getContextThemeKey(){
        if(state.mode === "private"){ return "private"; }
        if(state.currentCompanyId === "co-gamefik"){ return "gamefik"; }
        return "leapy";
      }
      function renderEntityIcon(color, shape, text){
        return '<span class="icon ' + color + " " + shape + '">' + text + "</span>";
      }
      function renderBotIcon(bot){
        return renderEntityIcon(bot.color, bot.shape, initials(bot.name));
      }
      function channelGlyph(channel){
        if(channel.type === "private"){ return "🔒"; }
        if(channel.type === "dm"){ return "•"; }
        if(channel.type === "turma"){ return "🎓"; }
        return "#";
      }
      function channelLabel(channel){
        if(channel.type === "private"){ return " " + channel.label; }
        if(channel.type === "public"){ return " " + channel.label; }
        return channel.label;
      }
      function pinBot(bot){
        if(!bot){ return; }
        bot.favorite = true;
        bot.time = formatTime();
        favNote.textContent = bot.name + " foi fixado nos favoritos.";
        showToast(bot.name + " fixado nos favoritos.");
        renderAll();
      }
      function moveBotToSection(bot, targetSection){
        if(!bot || !targetSection){ return; }
        bot.section = targetSection;
        bot.favorite = false;
        bot.time = formatTime();
        favNote.textContent = bot.name + " foi movido para " + sectionTitles[targetSection] + ".";
        showToast(bot.name + " movido para " + sectionTitles[targetSection] + ".");
        renderAll();
      }
      function openPrivate(){
        state.mode = "private";
        palette.hidden = true;
        renderAll();
      }
      function openCompany(companyId){
        var company = getCompany(companyId);
        if(!company){ return; }
        state.mode = "company";
        state.currentCompanyId = companyId;
        if(!state.currentChannelByCompany[companyId] && company.channels[0]){
          state.currentChannelByCompany[companyId] = company.channels[0].id;
        }
        palette.hidden = true;
        renderAll();
      }
      function openBot(botId){
        state.mode = "private";
        state.currentBotId = botId;
        renderAll();
      }
      function openChannel(companyId, channelId){
        state.mode = "company";
        state.currentCompanyId = companyId;
        state.currentChannelByCompany[companyId] = channelId;
        renderAll();
      }

      function renderRail(){
        var privateActive = state.mode === "private";
        var privateUnread = bots.filter(function(bot){ return bot.unread; }).length;
        var privateBtn = [
          '<button class="r-btn' + (privateActive ? " active" : "") + '" data-context-type="private" aria-label="Meus agentes">',
          renderEntityIcon("c-lilac", "shape-circle", "MW"),
          privateUnread ? '<span class="r-badge">' + privateUnread + "</span>" : "",
          "</button>",
          '<span class="r-cap">meus</span>',
          '<span class="r-sep"></span>'
        ].join("");

        var companyButtons = companies.map(function(company){
          var active = state.mode === "company" && state.currentCompanyId === company.id;
          var unreadCount = company.channels.filter(function(channel){ return channel.unread; }).length;
          return [
            '<button class="r-btn' + (active ? " active" : "") + '" data-context-type="company" data-company-id="' + company.id + '" aria-label="' + company.name + '">',
            renderEntityIcon(company.color, "shape-square", company.abbr),
            unreadCount ? '<span class="r-badge">' + unreadCount + "</span>" : "",
            "</button>"
          ].join("");
        }).join("");

        contextRail.innerHTML = privateBtn + companyButtons + '<span class="r-sep" style="margin-top:auto;"></span><button class="r-btn" aria-label="Adicionar empresa">+</button>';
      }

      function renderFavorites(){
        var favs = bots.filter(function(bot){ return bot.favorite; });
        favCount.textContent = favs.length + " fixados";
        if(!favs.length){
          favoritesGrid.innerHTML = '<div style="grid-column:1/-1;font-size:11px;color:#7b8393;padding:10px 6px;">Arraste bots para ca e fixe seus principais.</div>';
          return;
        }
        favoritesGrid.innerHTML = favs.map(function(bot){
          return [
            '<button class="fav" draggable="true" data-bot-id="' + bot.id + '" aria-label="Abrir ' + bot.name + '">',
            renderBotIcon(bot),
            "<b>" + bot.name + "</b>",
            "<span>" + (bot.subtitle || "Bot") + "</span>",
            "</button>"
          ].join("");
        }).join("");
      }

      function renderPrivateSections(){
        sectionsMount.innerHTML = sectionsOrder.map(function(sec){
          var items = bots.filter(function(bot){ return bot.section === sec; });
          var rows = items.map(function(bot){
            var active = state.mode === "private" && bot.id === state.currentBotId ? " active" : "";
            var dot = bot.unread ? '<span class="dot"></span>' : "";
            var pin = bot.favorite ? '<span class="pin" title="Favorito">★</span>' : "";
            return [
              '<button class="row' + active + '" draggable="true" data-bot-id="' + bot.id + '" aria-label="Abrir conversa com ' + bot.name + '">',
              renderBotIcon(bot),
              '<span class="txt"><b>' + bot.name + '</b><span>' + bot.preview + "</span></span>",
              '<span class="meta">' + pin + '<span>' + bot.time + "</span>" + dot + "</span>",
              "</button>"
            ].join("");
          }).join("");
          if(!rows){
            rows = '<div style="padding:6px 8px 10px;font-size:11.5px;color:#96a0b1;">Arraste bots para esta secao.</div>';
          }
          return '<section class="section" data-section="' + sec + '"><h3>' + sectionTitles[sec] + "</h3>" + rows + "</section>";
        }).join("");
      }

      function renderCompanySidebar(){
        var company = getCompany(state.currentCompanyId);
        if(!company){ return; }
        companyTitle.textContent = company.name;
        companyBadge.className = "icon " + company.color + " shape-square";
        companyBadge.textContent = company.abbr;

        companySectionsMount.innerHTML = companyGroupOrder.map(function(group){
          var items = company.channels.filter(function(channel){ return channel.group === group; });
          var rows = items.map(function(channel){
            var active = state.currentChannelByCompany[company.id] === channel.id ? " active" : "";
            var unread = channel.unread ? '<span class="dot"></span>' : "";
            return [
              '<button class="row' + active + '" data-channel-id="' + channel.id + '" aria-label="Abrir ' + channel.label + '">',
              renderEntityIcon(company.color, "shape-square", channelGlyph(channel)),
              '<span class="txt"><b>' + channelLabel(channel) + '</b><span>' + channel.preview + "</span></span>",
              '<span class="meta"><span>' + channel.time + "</span>" + unread + "</span>",
              "</button>"
            ].join("");
          }).join("");
          if(!rows){
            rows = '<div style="padding:6px 8px 10px;font-size:11.5px;color:#96a0b1;">Sem conversas nesta secao.</div>';
          }
          return '<section class="section"><h3>' + group + "</h3>" + rows + "</section>";
        }).join("");
      }

      function renderStarter(bot){
        if(!bot.starter){ return ""; }
        var options = bot.starter.options.map(function(opt){
          return [
            '<button class="choice" data-seed="' + opt[1] + '">',
            '<span class="badge">' + opt[0] + "</span>",
            "<span><b>" + opt[1] + "</b><span>" + opt[2] + "</span></span>",
            "</button>"
          ].join("");
        }).join("");
        return [
          '<div class="starter">',
          '<div class="intro">' + bot.starter.intro + "</div>",
          '<div class="q"><h4>' + bot.starter.title + '</h4><p>' + bot.starter.subtitle + '</p>',
          '<div class="choices">' + options + "</div>",
          '<div class="free">Digite sua propria resposta</div>',
          "</div></div>"
        ].join("");
      }

      function renderMessage(msg){
        var side = msg.from === "you" ? "you" : "bot";
        var text = msg.text.replace(/</g, "&lt;");
        return [
          '<article class="message ' + side + '">',
          '<div class="bubble-wrap">',
          '<div class="msg-actions"><button title="Reacao">☺</button><button title="Responder">↩</button><button title="Mais">…</button></div>',
          '<div class="bubble">' + text + "</div>",
          "</div>",
          "</article>"
        ].join("");
      }

      function renderChat(){
        if(state.mode === "private"){
          var bot = getBot(state.currentBotId);
          if(!bot){ return; }
          headName.textContent = bot.name;
          headTag.textContent = "privado";
          headIcon.className = "icon " + bot.color + " " + bot.shape;
          headIcon.textContent = initials(bot.name);
          composer.placeholder = "Mensagem para " + bot.name;

          var privateBody = ['<div class="time-sep">sex., 11 de set. 11:53</div>'];
          privateBody.push(renderStarter(bot));
          bot.messages.forEach(function(msg){ privateBody.push(renderMessage(msg)); });
          timeline.innerHTML = privateBody.join("");
          return;
        }

        var company = getCompany(state.currentCompanyId);
        var channel = getCurrentChannel();
        if(!company || !channel){ return; }
        headName.textContent = channelLabel(channel).trim();
        headTag.textContent = company.name;
        headIcon.className = "icon " + company.color + " shape-square";
        headIcon.textContent = channelGlyph(channel);
        composer.placeholder = "Mensagem para " + channelLabel(channel).trim();

        var channelBody = ['<div class="time-sep">hoje</div>'];
        channel.messages.forEach(function(msg){ channelBody.push(renderMessage(msg)); });
        timeline.innerHTML = channelBody.join("");
      }

      function renderPalette(){
        paletteBotList.innerHTML = bots.map(function(bot){
          return '<button class="opt" data-open-bot="' + bot.id + '">' + renderBotIcon(bot) + bot.name + "</button>";
        }).join("");
      }

      function renderLayoutState(){
        var inPrivate = state.mode === "private";
        var ctxKey = getContextThemeKey();
        sidebarEl.setAttribute("data-context", ctxKey);
        mainPanel.setAttribute("data-context", ctxKey);
        privateSidebar.hidden = !inPrivate;
        companySidebar.hidden = inPrivate;
        if(inPrivate){
          createBtn.hidden = false;
        } else {
          createBtn.hidden = true;
          palette.hidden = true;
        }
      }

      function wireBotRows(){
        document.querySelectorAll(".row[data-bot-id], .fav[data-bot-id]").forEach(function(el){
          el.addEventListener("click", function(){
            var id = el.getAttribute("data-bot-id");
            if(id){ openBot(id); }
          });
          el.addEventListener("mousedown", function(e){
            var id = el.getAttribute("data-bot-id");
            if(!id){ return; }
            state.pointerCandidateId = id;
            state.pointerStartX = e.clientX;
            state.pointerStartY = e.clientY;
          });
          el.addEventListener("dragstart", function(e){
            var id = el.getAttribute("data-bot-id");
            if(!id){ return; }
            state.dragBotId = id;
            e.dataTransfer.setData("text/plain", id);
            e.dataTransfer.effectAllowed = "move";
          });
        });

        document.querySelectorAll(".section[data-section]").forEach(function(sec){
          sec.addEventListener("dragover", function(e){
            e.preventDefault();
            sec.classList.add("is-drop");
          });
          sec.addEventListener("dragleave", function(){
            sec.classList.remove("is-drop");
          });
          sec.addEventListener("drop", function(e){
            e.preventDefault();
            sec.classList.remove("is-drop");
            var id = e.dataTransfer.getData("text/plain") || state.dragBotId;
            moveBotToSection(getBot(id), sec.getAttribute("data-section"));
          });
          sec.addEventListener("mouseup", function(){
            if(!state.dragBotId){ return; }
            moveBotToSection(getBot(state.dragBotId), sec.getAttribute("data-section"));
          });
        });
      }

      function wireFavoritesDrop(){
        if(wireFavoritesDrop._bound){ return; }
        wireFavoritesDrop._bound = true;

        favoritesDrop.addEventListener("dragover", function(e){
          e.preventDefault();
          favoritesDrop.classList.add("is-drop");
        });
        favoritesDrop.addEventListener("dragleave", function(){
          favoritesDrop.classList.remove("is-drop");
        });
        favoritesDrop.addEventListener("drop", function(e){
          e.preventDefault();
          favoritesDrop.classList.remove("is-drop");
          var id = e.dataTransfer.getData("text/plain") || state.dragBotId;
          pinBot(getBot(id));
        });
        favoritesDrop.addEventListener("mouseup", function(){
          if(!state.dragBotId){ return; }
          pinBot(getBot(state.dragBotId));
        });
      }

      function wireCompanyRows(){
        document.querySelectorAll("[data-channel-id]").forEach(function(el){
          el.addEventListener("click", function(){
            openChannel(state.currentCompanyId, el.getAttribute("data-channel-id"));
          });
        });
      }

      function autoresize(){
        composer.style.height = "auto";
        composer.style.height = Math.min(composer.scrollHeight, 170) + "px";
      }

      function sendMessage(seedText){
        var text = (seedText || composer.value || "").trim();
        if(!text){ return; }

        if(state.mode === "private"){
          var bot = getBot(state.currentBotId);
          if(!bot){ return; }
          bot.messages.push({from:"you", text:text});
          composer.value = "";
          autoresize();
          renderChat();
          chatScroll.scrollTop = chatScroll.scrollHeight;

          window.setTimeout(function(){
            bot.messages.push({from:"bot", text:"Entendi. Vou agir nisso agora e volto com um resumo objetivo ainda nesta conversa."});
            renderChat();
            chatScroll.scrollTop = chatScroll.scrollHeight;
          }, 650);
          return;
        }

        var channel = getCurrentChannel();
        if(!channel){ return; }
        channel.messages.push({from:"you", text:text});
        composer.value = "";
        autoresize();
        renderChat();
        chatScroll.scrollTop = chatScroll.scrollHeight;

        window.setTimeout(function(){
          channel.messages.push({from:"bot", text:"Recebi. Vou processar no contexto deste canal e paro para sua aprovacao antes de qualquer envio sensivel."});
          renderChat();
          chatScroll.scrollTop = chatScroll.scrollHeight;
        }, 700);
      }

      function createNewBot(){
        state.newBotCount += 1;
        var id = "b-new-" + state.newBotCount;
        var bot = {
          id: id,
          name: "Novo Bot",
          subtitle: "",
          preview: "Acabamos de nos conhecer.",
          time: "agora",
          section: "sem-secao",
          favorite: false,
          unread: false,
          shape: "shape-square",
          color: "c-red",
          starter: {
            intro: "Oi, Marlon. Aqui e o New Bot - acabamos de nos conhecer. Pronto pra te ajudar no que for mais util pra voce.",
            title: "Pra que voce quer me usar?",
            subtitle: "Pode escolher ou escrever do seu jeito.",
            options: [
              ["A","Tarefas do dia a dia","Lembretes, organizacao, follow-ups"],
              ["B","Trabalho na Leapy","Produto, ClickUp, Slack, codigo..."],
              ["C","Pesquisa e respostas","Pesquisas, comparacoes e drafts"],
              ["D","Ainda nao sei","Me ajuda a descobrir no caminho"]
            ]
          },
          messages: []
        };
        bots.unshift(bot);
        state.mode = "private";
        state.currentBotId = id;
        palette.hidden = true;
        renderAll();
        composer.focus();
      }

      function renderAll(){
        renderRail();
        renderLayoutState();
        if(state.mode === "private"){
          renderFavorites();
          renderPrivateSections();
          renderPalette();
          wireBotRows();
          wireFavoritesDrop();
        } else {
          renderCompanySidebar();
          wireCompanyRows();
        }
        renderChat();
      }

      createBtn.addEventListener("click", function(){
        if(state.mode !== "private"){ return; }
        palette.hidden = !palette.hidden;
      });
      document.getElementById("closePalette").addEventListener("click", function(){
        palette.hidden = true;
      });
      document.getElementById("createNewOption").addEventListener("click", function(){
        createNewBot();
      });
      paletteBotList.addEventListener("click", function(e){
        var button = e.target.closest("[data-open-bot]");
        if(!button){ return; }
        openBot(button.getAttribute("data-open-bot"));
        palette.hidden = true;
      });

      timeline.addEventListener("click", function(e){
        var button = e.target.closest(".choice");
        if(!button){ return; }
        composer.value = button.getAttribute("data-seed");
        autoresize();
        composer.focus();
      });

      composer.addEventListener("input", autoresize);
      composer.addEventListener("keydown", function(e){
        if(e.key === "Enter" && !e.shiftKey){
          e.preventDefault();
          sendMessage();
        }
      });
      document.getElementById("sendBtn").addEventListener("click", function(){
        sendMessage();
      });

      contextRail.addEventListener("click", function(e){
        var btn = e.target.closest("[data-context-type]");
        if(!btn){ return; }
        var type = btn.getAttribute("data-context-type");
        if(type === "private"){
          openPrivate();
          return;
        }
        openCompany(btn.getAttribute("data-company-id"));
      });
      backToPrivate.addEventListener("click", function(){
        openPrivate();
      });

      document.addEventListener("click", function(e){
        if(palette.hidden){ return; }
        if(e.target.closest("#palette") || e.target.closest("#createBtn")){ return; }
        palette.hidden = true;
      });
      document.addEventListener("mousemove", function(e){
        if(!state.pointerCandidateId){ return; }
        var dx = Math.abs(e.clientX - state.pointerStartX);
        var dy = Math.abs(e.clientY - state.pointerStartY);
        if(dx + dy > 8){
          state.dragBotId = state.pointerCandidateId;
        }
      });
      document.addEventListener("mouseup", function(){
        state.pointerCandidateId = null;
        window.setTimeout(function(){ state.dragBotId = null; }, 0);
      });

      renderAll();
      autoresize();
      chatScroll.scrollTop = chatScroll.scrollHeight;
    })();
  </script>
</body>
</html>
