# Deploy de produção na GCP (docs/deploy-gcp.md): depois do ci verde num push ao main, gera a imagem,
# publica no Artifact Registry e roda infra/gcp/vm/deploy.sh na VM pelo túnel IAP (migra como nod_dono
# e troca a cor azul/verde sem queda, NOD-218). Autenticação por Workload Identity Federation: nenhuma chave da GCP mora no GitHub.
# Actions pinadas por SHA imutável (verificados em 2026-10-02 na API do GitHub):
#   actions/checkout v4.2.2                    = 11bd71901bbe5b1630ceea73d27597364c9af683
#   google-github-actions/auth v3.0.0          = 7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
#   google-github-actions/setup-gcloud v3.0.1  = aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
name: deploy
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Um deploy por vez e nunca cancelado no meio (a migração não pode ser interrompida).
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    # Runner próprio (infra/gcp/runner/): não consome minutos do plano.
    runs-on: [self-hosted, linux, nod-ci]
    environment: producao
    permissions:
      contents: read
      id-token: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SHA }}

      - name: Configuração
        run: grep -E '^[A-Z_]+=' infra/gcp/config.env >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Imagem
        run: |
          gcloud auth configure-docker "${REGIAO}-docker.pkg.dev" --quiet
          docker build -t "$REGISTRO/nod:$SHA" .
          docker push "$REGISTRO/nod:$SHA"

      - name: Arquivos da VM
        run: |
          gcloud compute ssh "$VM_NOME" --project="$PROJETO" --zone="$ZONA" --tunnel-through-iap --quiet \
            --command="mkdir -p ~/nod-deploy"
          gcloud compute scp infra/gcp/config.env infra/gcp/vm/compose.yml infra/gcp/vm/Caddyfile infra/gcp/vm/deploy.sh \
            "$VM_NOME":nod-deploy/ --project="$PROJETO" --zone="$ZONA" --tunnel-through-iap --quiet

      # NOD-331: o Caddyfile vai em estágio (Caddyfile.novo); o deploy.sh só o promove na troca, com a cor nova
      # saudável, e devolve o anterior se a troca não confirmar. Caddyfile.novo.tag diz de que deploy é o estágio: um
      # rollback manual para outra tag não promove o que sobrou de um deploy que falhou (QA NOD-331).
      - name: Deploy
        run: |
          gcloud compute ssh "$VM_NOME" --project="$PROJETO" --zone="$ZONA" --tunnel-through-iap --quiet \
            --command="sudo install -m 0640 ~/nod-deploy/config.env ~/nod-deploy/compose.yml /opt/nod/ && sudo install -m 0640 ~/nod-deploy/Caddyfile /opt/nod/Caddyfile.novo && echo '$SHA' | sudo tee /opt/nod/Caddyfile.novo.tag >/dev/null && sudo install -m 0750 ~/nod-deploy/deploy.sh /opt/nod/ && sudo /opt/nod/deploy.sh '$SHA'"
