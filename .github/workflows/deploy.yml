# Deploy de produção na GCP (docs/deploy-gcp.md): depois do ci verde num push ao main, gera a imagem,
# publica no Artifact Registry e roda infra/gcp/vm/deploy.sh na VM pelo túnel IAP (migra como nod_dono
# e troca a cor azul/verde sem queda, NOD-218). Autenticação por Workload Identity Federation: nenhuma chave da GCP mora no GitHub.
# Actions pinadas por SHA imutável (verificados em 2026-10-02 na API do GitHub):
#   actions/checkout v4.2.2                    = 11bd71901bbe5b1630ceea73d27597364c9af683
#   google-github-actions/auth v3.0.0          = 7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
#   google-github-actions/setup-gcloud v3.0.1  = aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
name: deploy
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Um deploy por vez e nunca cancelado no meio (a migração não pode ser interrompida).
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    # NOD-485 (ADR-161): o deploy passou para o marlonwlv/nod. Com vars.DEPLOY_PELO_PUBLICO == '1' este não roda mais
    # (nem por push, nem à mão); reverter o corte = apagar a variável aqui e zerar DEPLOY_PUBLICO lá.
    if: vars.DEPLOY_PELO_PUBLICO != '1' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    # Blacksmith (definido em 2026-11-04, junto com o ci.yml): runner novo por deploy. A VM de produção fica na GCP; daqui
    # só saem a imagem (Artifact Registry) e os comandos pelo túnel IAP, com WIF — nada depende da rede interna da GCP.
    # A chave SSH que o gcloud gera em cada runner novo entra no OS Login com validade curta (--ssh-key-expire-after).
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: producao
    permissions:
      contents: read
      id-token: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SHA }}

      - name: Configuração
        run: grep -E '^[A-Z_]+=' infra/gcp/config.env >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Imagem
        run: |
          gcloud auth configure-docker "${REGIAO}-docker.pkg.dev" --quiet
          docker build -t "$REGISTRO/nod:$SHA" .
          docker push "$REGISTRO/nod:$SHA"

      - name: Arquivos da VM
        run: |
          gcloud compute ssh "$VM_NOME" --project="$PROJETO" --zone="$ZONA" --tunnel-through-iap --ssh-key-expire-after=1h --quiet \
            --command="mkdir -p ~/nod-deploy"
          gcloud compute scp infra/gcp/config.env infra/gcp/vm/compose.yml infra/gcp/vm/Caddyfile infra/gcp/vm/deploy.sh \
            "$VM_NOME":nod-deploy/ --project="$PROJETO" --zone="$ZONA" --tunnel-through-iap --ssh-key-expire-after=1h --quiet

      # NOD-331: o Caddyfile vai em estágio (Caddyfile.novo); o deploy.sh só o promove na troca, com a cor nova
      # saudável, e devolve o anterior se a troca não confirmar. Caddyfile.novo.tag diz de que deploy é o estágio: um
      # rollback manual para outra tag não promove o que sobrou de um deploy que falhou (QA NOD-331).
      # NOD-485: a trava da VM (flock em /opt/nod/deploy.lock, a mesma do deploy.sh, que reaproveita o descritor herdado)
      # cobre a instalação dos arquivos E o deploy: sem ela, um deploy do marlonwlv/nod trocaria config.env, compose.yml e
      # Caddyfile.novo no meio deste. A pasta de estágio (~/nod-deploy) é só deste repo; o público usa ~/nod-deploy-publico.
      - name: Deploy
        run: |
          gcloud compute ssh "$VM_NOME" --project="$PROJETO" --zone="$ZONA" --tunnel-through-iap --ssh-key-expire-after=1h --quiet \
            --command="sudo flock -w 1800 -E 75 /opt/nod/deploy.lock sh -c 'install -m 0640 \$1/config.env \$1/compose.yml /opt/nod/ && install -m 0640 \$1/Caddyfile /opt/nod/Caddyfile.novo && echo \$2 > /opt/nod/Caddyfile.novo.tag && install -m 0750 \$1/deploy.sh /opt/nod/ && exec /opt/nod/deploy.sh \$2' _ ~/nod-deploy '$SHA'" ||
            { rc=$?; [ "$rc" != 75 ] || echo "::error::outro deploy segura /opt/nod/deploy.lock há 30 min; nada foi mexido"; exit "$rc"; }
