name: desktop-release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5434:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL_DONO: postgres://nod_dono:nod@127.0.0.1:5434/nod
      DATABASE_URL_TEST: postgres://nod_app:nod@127.0.0.1:5434/nod_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: psql postgres://postgres:postgres@127.0.0.1:5434/postgres -v ON_ERROR_STOP=1 -f infra/postgres/init/01_roles.sql
      - run: npm run db:migrate:test
      - run: npm run check
      - run: npm run build
      - run: npm run desktop:build
  mac:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # NOD-203: o endereço do servidor embutido no app (ADR-069). Variável de repositório, não secret: aparece no app.
      NOD_SERVIDOR_PADRAO: ${{ vars.NOD_SERVIDOR_PADRAO }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
      # Antes do npm ci: falta de secret ou da variável falha aqui, listando tudo de uma vez.
      - name: Preflight da release
        run: node scripts/desktop/release-preflight.mjs
      - run: npm ci
      - run: npm run desktop:build
      # NOD-187: antes do empacotamento, para falhar cedo sem gastar assinatura e notarização.
      # Sem prazo, um Electron travado (GPU/viz sob carga) prenderia o job até o limite de 6 h do runner.
      - name: Smoke da janela
        timeout-minutes: 5
        run: npx electron scripts/desktop/smoke-window.mjs
      # NOD-133: o alvo explícito (`dmg`) faz a CLI mandar na arquitetura. Só com `--arm64`, o `arch: [arm64, x64]` do
      # electron-builder.yml vence (app-builder-lib targetFactory) e cada job empacotava, assinava e notarizava as duas.
      - name: Empacotar, assinar e notarizar o .app
        run: |
          set -euo pipefail
          npx electron-builder --mac dmg --"$ARCH" --publish never --config.forceCodeSigning=true
          shopt -s nullglob
          apps=(release/*/nod.app)
          dmgs=(release/*.dmg)
          if [ "${#apps[@]}" -ne 1 ] || [ "${#dmgs[@]}" -ne 1 ]; then echo "::error::esperava só o app e o DMG $ARCH, veio: ${apps[*]} ${dmgs[*]}"; exit 1; fi
      # NOD-203: o electron-builder notariza só o .app; o DMG é notarizado e grampeado aqui. O `--wait` sai com 0
      # mesmo com status Invalid, então o status é conferido pelo verificador. A senha só passa pela expansão do env.
      - name: Notarizar e grampear o DMG
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(release/nod-*-mac-"$ARCH".dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then echo "::error::esperava 1 DMG release/nod-*-mac-$ARCH.dmg, veio ${#dmgs[@]}"; exit 1; fi
          DMG="${dmgs[0]}"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --output-format json > "$RUNNER_TEMP/notarizacao.json" || true
          if ID=$(node scripts/desktop/verificar-pacote-mac.mjs notarizacao "$RUNNER_TEMP/notarizacao.json"); then
            xcrun stapler staple "$DMG"
          else
            if [ -n "$ID" ]; then xcrun notarytool log "$ID" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" || true; fi
            exit 1
          fi
      - name: Verificar assinatura e notarização
        run: |
          set -euo pipefail
          if [ "$ARCH" = arm64 ]; then APP=release/mac-arm64/nod.app; LIPO=arm64; else APP=release/mac/nod.app; LIPO=x86_64; fi
          test -d "$APP"
          # NOD-133: o app testado é o da arquitetura do job, nativo deste runner (nada de Rosetta).
          VEIO=$(lipo -archs "$APP/Contents/MacOS/nod")
          if [ "$VEIO" != "$LIPO" ] || [ "$(uname -m)" != "$LIPO" ]; then echo "::error::$APP é $VEIO, o job é $LIPO e o runner é $(uname -m)"; exit 1; fi
          node scripts/desktop/smoke-proxy.mjs "$APP/Contents/MacOS/nod" "$APP/Contents/Resources/app.asar.unpacked/dist/desktop/proxy.mjs"
          node scripts/desktop/verificar-pacote-mac.mjs pacote "$APP" release/nod-*-mac-"$ARCH".dmg
      - name: Diagnóstico do pacote
        if: failure()
        run: |
          APP=$(find release -maxdepth 2 -name nod.app -type d)
          for A in $APP; do
            echo "== $A"
            lipo -archs "$A/Contents/MacOS/nod" || true
            codesign -d --entitlements - "$A" || true
            spctl -a -vv "$A" || true
          done
          ls -la release || true
      # Depois do grampo e da verificação: o hash publicado é o do DMG final.
      - name: SHA-256 do DMG
        run: shasum -a 256 release/nod-*-mac-"$ARCH".dmg > "release/SHA256-${ARCH}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nod-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/SHA256-*.txt
          if-no-files-found: error
  # NOD-93 (PR 1): o disco da VM local do Mac, um por arquitetura, do mesmo Dockerfile do computador do Linux
  # (infra/vm-local/construir-disco.sh). Cada disco nasce num runner da própria arquitetura: o virt-customize roda o
  # apt do convidado. Atrás da variável de repositório NOD_VM_LOCAL=1, como o app (a flag de mesmo nome): sem ela o
  # release segue só com os DMGs.
  vm-local:
    needs: verify
    if: vars.NOD_VM_LOCAL == '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Ferramentas do disco
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libguestfs-tools qemu-utils zstd
          # O libguestfs do Ubuntu lê o kernel do host para montar o appliance; ele vem 0600.
          sudo chmod 0644 /boot/vmlinuz-*
      - name: Imagem do computador (só a desta arquitetura)
        run: |
          set -euo pipefail
          VERSAO=$(node -p "require('./package.json').version")
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"
          node scripts/computador/build.ts --plataformas "linux/$ARCH" --versao "$VERSAO" --saida dist/vm-local
      - name: Disco da VM
        run: sudo -E bash infra/vm-local/construir-disco.sh "$ARCH" "$VERSAO" "dist/vm-local/nod-computador-$ARCH.tar" release
      - name: Conferir o disco
        run: |
          set -euo pipefail
          cd release
          sha256sum -c "nod-vm-$VERSAO-$ARCH.img.zst.sha256"
          zstd -t "nod-vm-$VERSAO-$ARCH.img.zst"
          ls -la
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nod-vm-${{ matrix.arch }}
          path: |
            release/nod-vm-*.img.zst
            release/nod-vm-*.img.zst.sha256
          if-no-files-found: error
          compression-level: 0
  draft:
    # O vm-local pulado (sem NOD_VM_LOCAL) não segura o rascunho; falho, segura.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.mac.result == 'success' && (needs.vm-local.result == 'success' || needs.vm-local.result == 'skipped') }}
    needs: [mac, vm-local]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: nod-*
          path: release
          merge-multiple: true
      - name: Criar release em rascunho para aceite nos dois Macs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          arquivos=(release/*.dmg release/SHA256-*.txt release/nod-vm-*.img.zst release/nod-vm-*.img.zst.sha256)
          gh release create "$TAG" "${arquivos[@]}" --verify-tag --draft --title "nod $TAG" --notes-file desktop/release-notes.md
